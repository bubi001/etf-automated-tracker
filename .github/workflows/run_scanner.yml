name: Automated Indian ETF Monitor

on:
  schedule:
    # 10:30 AM UTC translates exactly to 4:00 PM IST (Monday through Friday)
    # This triggers the script right after the Indian market closes at 3:30 PM IST.
    - cron: '30 10 * * 1-5'
  workflow_dispatch:      # Retains the manual "Run workflow" trigger button on GitHub

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Grants the workflow permission to save changes back to your repository
      
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live ETF Analysis Pipeline
        run: python etf_scanner.py

      - name: Commit and Persist Execution Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add etf_scan_report.csv
          git commit -m "Auto-update Indian ETF Matrix: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No trend shifts or data changes detected today."
          git push
