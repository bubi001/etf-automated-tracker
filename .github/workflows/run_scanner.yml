name: Automated Indian ETF Monitor

on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Live ETF Analysis Pipeline
        run: python etf_scanner.py

      - name: Commit and Persist Execution Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add etf_scan_report.csv || true
          git commit -m "Auto-update Indian ETF Matrix: $(date -u +'%Y-%m-%d %H:%M UTC')" || true
          git push || true
